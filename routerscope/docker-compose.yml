services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://routerscope:${POSTGRES_PASSWORD}@db:5432/routerscope
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
  frontend:
    image: node:22-alpine
    working_dir: /web
    volumes:
      - ./frontend:/web
      - frontend_node_modules:/web/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE: http://localhost:8000
    depends_on:
      - backend
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: routerscope
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: routerscope
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routerscope -d routerscope"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
  frontend_node_modules:
